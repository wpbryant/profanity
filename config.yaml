# Whisper settings
whisper_model: "medium"  # tiny, base, small, medium, large
whisper_device: "cuda"  # or "cpu" for CPU

# Remote Whisper settings (used when whisper_mode is "remote" or --remote flag is set)
whisper_mode: "local"  # "local" = faster-whisper on this machine, "remote" = offload to API server
whisper_api_url: "http://192.168.1.135:9000"  # URL of whisper-asr-webservice
whisper_api_timeout: 600  # request timeout in seconds

# Filtering settings
padding_before_ms: 100
padding_after_ms: 150
profanity_file: "en.json"
min_severity: 3  # 1=all, 2=moderate+, 3=strong+, 4=severe only

# Output settings
log_detections: true

# Audio settings
audio_track_index: 0  # which audio track to process
clean_track_title: "English (Clean)"
clean_track_mode: "default"  # add=extra track, default=extra track set as default, replace=remove original
volume_boost: 2.0  # boost clean audio volume (1.0 = no change, 2.0 = 2x louder)
